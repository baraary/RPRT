    <script>
      (function () {
        var OrigWebSocket = window.WebSocket;
        if (!OrigWebSocket) return;
        function MockViteSocket(url, protocols) {
          this.url = url;
          this.protocol = Array.isArray(protocols) ? protocols[0] || '' : protocols || '';
          this.readyState = 3;
          this.send = function () {};
          this.close = function () {};
          this.addEventListener = function () {};
          this.removeEventListener = function () {};
          this.dispatchEvent = function () { return true; };
        }
        MockViteSocket.CONNECTING = 0;
        MockViteSocket.OPEN = 1;
        MockViteSocket.CLOSING = 2;
        MockViteSocket.CLOSED = 3;
        var WrappedWebSocket = function (url, protocols) {
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          var urlStr = String(url || '');
          if (protoStr.indexOf('vite') !== -1 || urlStr.indexOf('token=') !== -1) {
            return new MockViteSocket(url, protocols);
          }
          return protocols !== undefined
            ? new OrigWebSocket(url, protocols)
            : new OrigWebSocket(url);
        };
        WrappedWebSocket.prototype = OrigWebSocket.prototype;
        WrappedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
        WrappedWebSocket.OPEN = OrigWebSocket.OPEN;
        WrappedWebSocket.CLOSING = OrigWebSocket.CLOSING;
        WrappedWebSocket.CLOSED = OrigWebSocket.CLOSED;
        window.WebSocket = WrappedWebSocket;
      })();
    </script>
